name: TrailRace TR1 Java and JS validation
on:
  push:
    branches:
      - feature/tr1-js-runtime-and-gpx-fidelity
      - experiment/terrain-debiased-curve-v1
  pull_request:
    branches:
      - experiment/terrain-debiased-curve-v1
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript TR1
        run: node tools/test_trailrace_tr1.js
      - name: Maven package
        run: mvn -B -DskipTests package
      - name: GraalJS runtime smoke
        run: java -cp "target/classes:target/lib/*" course_generator.tests.TrailRaceTr1EngineSmoke
      - name: Internet check must not block Swing EDT
        run: java -Djava.awt.headless=true -cp "target/classes:target/lib/*" course_generator.tests.InternetConnectivityMonitorSmoke
      - name: Roadbook default format, font and slope profile smoke
        run: java -Djava.awt.headless=true -cp "target/classes:target/lib/*" course_generator.tests.RoadbookDefaultsSmoke
      - name: GPX XML and waypoint regression smoke
        run: java -cp "target/classes:target/lib/*" course_generator.tests.GpxWaypointRoundtripSmoke
      - name: QR payload and PNG round-trip smoke
        run: java -cp "target/classes:target/lib/*" course_generator.tests.TrailRaceQrSmoke
      - name: FIT export options and barrier-pace Virtual Partner smoke
        run: java -cp "target/classes:target/lib/*" course_generator.tests.GarminFitBarrierVirtualPartnerSmoke

      - name: V5 release notes and opt-out preference persistence smoke
        run: java -cp "target/classes:target/lib/*" course_generator.tests.ReleaseNotesV5Smoke