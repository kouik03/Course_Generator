name: Course IQ Java checks

on:
  push:
    branches: [feature/course-iq-export-v1]
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run Java tests
        run: mvn --batch-mode --no-transfer-progress clean test
